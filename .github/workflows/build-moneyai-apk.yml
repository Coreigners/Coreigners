name: Build MoneyAI APK

on:
  push:
    paths:
      - 'moneyai-build/MoneyAI/**'
      - '.github/workflows/build-moneyai-apk.yml'
  pull_request:
    paths:
      - 'moneyai-build/MoneyAI/**'
      - '.github/workflows/build-moneyai-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moneyai-build/MoneyAI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyAI-S25Ultra
          path: moneyai-build/MoneyAI/app/build/outputs/apk/debug/app-debug.apk
